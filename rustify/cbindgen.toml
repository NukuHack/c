language = "C"
include_guard = "MY_RUST_LIB_H"
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not edit. */"
namespace = "mylib"

# Only emit functions with #[no_mangle] — skips any Rust-only helpers
# customize if needed, some internals should not be exposed
# [export]
# include = ["add_numbers", "multiply_numbers", "string_length"]
# item_types = ["functions"]

[defines]
# Lets you switch calling conventions or feature flags from C
"feature = x" = "MYLIB_FEATURE_X"

[fn]
# Optional: prefix every generated function, e.g. mylib_add_numbers
# prefix = "mylib_"

[parse]
parse_deps = false
